name: Docker

on:
  push:
    branches: ["master"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: ["master"]
    paths:
      - "docker/**"
      - ".dockerignore"
      - ".github/scripts/image-tags.sh"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  DB_BACKEND: ${{ vars.DB_BACKEND || 'mysql' }}
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # All tags are needed to know whether the pushed tag is the most recent one.
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Compute tags
        id: tags
        run: .github/scripts/image-tags.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: backend
          platforms: linux/amd64
          build-args: DB_BACKEND=${{ env.DB_BACKEND }}
          push: ${{ env.PUSH }}
          tags: ${{ steps.tags.outputs.backend_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.backend_version }}
          cache-from: type=gha,scope=api-${{ env.DB_BACKEND }}
          # Later builds reuse the shared stages from the builder's local cache.
          cache-to: type=gha,scope=api-${{ env.DB_BACKEND }},mode=max

      - name: Build admin
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: admin
          platforms: linux/amd64
          build-args: DB_BACKEND=${{ env.DB_BACKEND }}
          push: ${{ env.PUSH }}
          tags: ${{ steps.tags.outputs.admin_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.admin_version }}

      - name: Build socc
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: socc
          platforms: linux/amd64
          build-args: DB_BACKEND=${{ env.DB_BACKEND }}
          push: ${{ env.PUSH }}
          tags: ${{ steps.tags.outputs.socc_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.socc_version }}

      - name: Build migrator
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: migrator
          platforms: linux/amd64
          build-args: DB_BACKEND=${{ env.DB_BACKEND }}
          push: ${{ env.PUSH }}
          tags: ${{ steps.tags.outputs.migrator_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.migrator_version }}
