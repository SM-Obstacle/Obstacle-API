[workspace]
resolver = "2"
members = [
  "crates/admin",
  "crates/compute-player-map-ranking",
  "crates/dsc_webhook",
  "crates/entity",
  "crates/game_api",
  "crates/graphql-api",
  "crates/graphql-schema-generator",
  "crates/migration",
  "crates/mx-layer",
  "crates/player-map-ranking",
  "crates/records_lib",
  "crates/request_filter",
  "crates/socc",
  "crates/test-env",
]

[workspace.package]
version = "1.6.1"

[workspace.dependencies]
thiserror = "2.0.21"
tokio = "1.54.1"
async-graphql = "7.2.1"
sqlx = { version = "0.9.1", features = ["chrono", "mysql", "runtime-tokio"] }
chrono = { version = "0.4.45", features = ["serde"] }
cron = "0.17.0"
deadpool = { version = "0.13.1", features = ["managed", "rt_tokio_1"] }
deadpool-redis = { version = "0.23.1", features = ["rt_tokio_1"] }
serde = "1.0.229"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
actix-web = "4.20.0"
actix-cors = "0.7.2"
async-graphql-actix-web = "7.2.1"
tracing-actix-web = "0.7.26"
reqwest = { version = "0.13.5", features = ["json"] }
rand = "0.10.4"
futures = "0.3.34"
sha256 = "1.6.0"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
anyhow = "1.0.104"
dotenvy = "0.15.7"
itertools = "0.15.0"
once_cell = "1.21.4"
csv = "1.4.0"
mkenv = "1.0.2"
moka = { version = "0.12.16", features = ["future"] }
nom = "8.0.0"
pin-project-lite = "0.2.18"
sea-orm = { version = "2.0.4", features = [
  "runtime-tokio",
  "macros",
  "with-chrono",
] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
simple-mermaid = "0.2.0"
prettytable = { version = "0.10.0", default-features = false }
